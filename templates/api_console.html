<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <meta name="login-url" content="{{ url_for('login') }}">
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      var theme = saved === 'dark' || saved === 'light' ? saved
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-bs-theme', theme);
    })();
  </script>
  <title>API Console — data.gov.gr Monitor</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='api_shared.css') }}">
  <style>
    .top-header { background: linear-gradient(135deg, #003366 0%, #0057b8 100%); color: #fff; padding: 1rem 1.5rem; }
    .api-shell { grid-template-columns: 320px 1fr; }
    .api-sidebar { padding-top: 16px; }

    .api-builder-empty { padding: 60px 32px; text-align: center; color: var(--api-text-faint); }
    .api-builder-empty i { font-size: 2.2rem; display: block; margin-bottom: 10px; }

    .api-builder { padding: 24px 32px 60px; max-width: 860px; }
    .api-builder-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
    .api-builder-desc { color: var(--api-text-muted); font-size: 0.88rem; margin: 4px 0 4px; }
    .api-builder-tags { display: flex; gap: 6px; margin-bottom: 18px; }

    .api-request-bar { display: flex; gap: 8px; align-items: stretch; margin-bottom: 18px; }
    .api-request-bar select { max-width: 110px; font-family: var(--api-mono); font-weight: 700; }
    .api-resolved-url {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 0 12px;
      border: 1px solid var(--api-border);
      border-radius: 6px;
      background: var(--api-surface-2);
      font-family: var(--api-mono);
      font-size: 0.85rem;
      overflow-x: auto;
      white-space: nowrap;
    }

    .api-builder-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--api-text-faint); margin-bottom: 8px; margin-top: 20px; }
    #apiPathParams .input-group-text { font-family: var(--api-mono); font-size: 0.8rem; }

    .api-qp-table { width: 100%; }
    .api-qp-table td { padding: 3px 4px; }
    .api-qp-table td:first-child, .api-qp-table td:nth-child(2) { width: 46%; }

    #apiBodyInput { font-family: var(--api-mono); font-size: 0.83rem; min-height: 140px; }

    .api-warning { font-size: 0.82rem; padding: 8px 12px; border-radius: 8px; margin-bottom: 16px; }

    #apiResponsePanel { margin-top: 26px; border-top: 1px solid var(--api-border); padding-top: 20px; }
    #apiRespBody {
      font-family: var(--api-mono);
      font-size: 0.8rem;
      white-space: pre-wrap;
      word-break: break-word;
      background: var(--api-surface-2);
      border: 1px solid var(--api-border-soft);
      border-radius: 8px;
      padding: 14px;
      max-height: 420px;
      overflow-y: auto;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="top-header d-flex align-items-center justify-content-between flex-wrap gap-2">
    <div class="d-flex align-items-center gap-3">
      <div>
        <a href="{{ url_for('index') }}" class="text-white-50 text-decoration-none small d-block mb-1">
          <i class="bi bi-arrow-left me-1"></i><span data-i18n="apiconsole.back_to_dashboard">Back to dashboard</span>
        </a>
        <div class="fw-bold fs-5"><i class="bi bi-play-circle me-2"></i><span data-i18n="apiconsole.title">API Testing Console</span></div>
      </div>
    </div>
    <div class="d-flex align-items-center flex-wrap justify-content-end gap-2 gap-md-3 row-gap-2">
      <a href="{{ url_for('api_docs_page') }}" class="btn btn-outline-light btn-sm px-3">
        <i class="bi bi-book me-1"></i><span data-i18n="apiconsole.open_docs">Reference</span>
      </a>
      {% set standalone_header = True %}
      {% include "_header_controls.html" %}
    </div>
  </div>

  <div class="api-shell">
    <aside class="api-sidebar">
      <div class="api-search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3" stroke-linecap="round"/></svg>
        <input id="apiSearch" type="text" class="form-control form-control-sm" data-i18n-ph="apiconsole.search_ph" placeholder="Find an endpoint…" autocomplete="off">
      </div>
      <div class="api-stat">
        <span class="l" data-i18n="apidocs.routes_label">Routes</span>
        <span class="n" id="apiStatTotal">—</span>
      </div>
      <div id="apiCategories" class="api-route-picker"></div>
      <div id="apiNoResults" data-i18n="apidocs.no_results">No routes match your search.</div>
    </aside>
    <main>
      <div class="api-builder-empty" id="apiBuilderEmpty">
        <i class="bi bi-cursor"></i>
        <span data-i18n="apiconsole.pick_hint">Pick an endpoint from the list to build a request.</span>
      </div>

      <div class="api-builder d-none" id="apiBuilder">
        <div class="api-builder-head">
          <span id="apiBuilderPath" class="api-mono fw-bold"></span>
        </div>
        <p class="api-builder-desc" id="apiBuilderDesc"></p>
        <div class="api-builder-tags" id="apiBuilderTags"></div>

        <div id="apiBuilderWarning"></div>

        <div class="api-request-bar">
          <select id="apiMethodSelect" class="form-select form-select-sm"></select>
          <div class="api-resolved-url" id="apiResolvedUrl"></div>
          <button class="btn btn-primary btn-sm px-3" id="apiSendBtn" onclick="sendRequest()">
            <span data-i18n="apiconsole.send">Send</span>
          </button>
        </div>

        <div id="apiPathParams" class="d-none"></div>

        <div class="api-builder-label" data-i18n="apiconsole.query_params">Query parameters</div>
        <table class="api-qp-table">
          <tbody id="apiQueryRows"></tbody>
        </table>
        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="addQueryRow()">
          <i class="bi bi-plus"></i> <span data-i18n="apiconsole.add_param">Add parameter</span>
        </button>

        <div id="apiBodySection" class="d-none">
          <div class="api-builder-label" data-i18n="apiconsole.body_json">Request body (JSON)</div>
          <textarea id="apiBodyInput" class="form-control" placeholder="{}"></textarea>
        </div>

        <div id="apiBuilderError" class="alert alert-danger mt-3 d-none"></div>

        <div id="apiResponsePanel" class="d-none">
          <div class="d-flex align-items-center gap-2 mb-2">
            <span class="api-builder-label mb-0" data-i18n="apiconsole.response">Response</span>
            <span id="apiRespStatus" class="badge api-mono"></span>
            <span id="apiRespTime" class="text-muted small api-mono"></span>
          </div>
          <pre id="apiRespBody"></pre>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='i18n_shared.js') }}"></script>
  <script src="{{ url_for('static', filename='api_shared.js') }}"></script>
  <script>
    // CSRF: same guarded fetch patch as app.js/webauthn.js -- this page is
    // fully standalone, and unlike api_docs.html it fires real POST/PATCH/
    // DELETE requests, so it needs the header attached automatically.
    if (!window.__csrfFetchPatched) {
      window.__csrfFetchPatched = true;
      const _csrfToken = document.querySelector('meta[name="csrf-token"]')?.content;
      const _loginUrl  = document.querySelector('meta[name="login-url"]')?.content;
      if (_csrfToken) {
        const _origFetch = window.fetch;
        window.fetch = function (input, init) {
          init = init || {};
          const method = (init.method || 'GET').toUpperCase();
          if (['POST', 'PUT', 'PATCH', 'DELETE'].includes(method)) {
            const headers = new Headers(init.headers || {});
            headers.set('X-CSRFToken', _csrfToken);
            init = { ...init, headers };
          }
          return _origFetch(input, init).then(resp => {
            if (_loginUrl && resp.status === 401 && !window.__sessionExpiredRedirecting) {
              window.__sessionExpiredRedirecting = true;
              location.href = _loginUrl + '?next=' + encodeURIComponent(location.pathname + location.search);
            }
            return resp;
          });
        };
      }
    }

    const TRANSLATIONS = {
      en: {
        'apiconsole.back_to_dashboard': 'Back to dashboard', 'apiconsole.title': 'API Testing Console',
        'apiconsole.open_docs': 'Reference', 'apiconsole.search_ph': 'Find an endpoint…',
        'apiconsole.pick_hint': 'Pick an endpoint from the list to build a request.',
        'apiconsole.send': 'Send', 'apiconsole.query_params': 'Query parameters', 'apiconsole.add_param': 'Add parameter',
        'apiconsole.body_json': 'Request body (JSON)', 'apiconsole.response': 'Response',
        'apiconsole.path_params': 'Path parameters',
        'apiconsole.fill_path_params': 'Fill in every path parameter before sending.',
        'apiconsole.invalid_json': 'Body is not valid JSON: {msg}',
        'apiconsole.confirm_delete': 'Send {method} {url}? This may permanently delete data.',
        'apiconsole.warn_stream': 'This is a Server-Sent Events endpoint — sending a normal request here will hang until it times out (~55s) instead of returning right away.',
        'apiconsole.warn_upload': 'This endpoint expects a multipart file upload, which this console\'s JSON body editor can\'t send. Use the actual dashboard page for this one.',
        'apiconsole.network_error': 'Network error: {msg}',
        'apiconsole.load_error': 'Could not load the route list: {msg}',
      },
      el: {
        'apiconsole.back_to_dashboard': 'Επιστροφή στον πίνακα ελέγχου', 'apiconsole.title': 'Κονσόλα Δοκιμών API',
        'apiconsole.open_docs': 'Οδηγός', 'apiconsole.search_ph': 'Αναζήτηση endpoint…',
        'apiconsole.pick_hint': 'Επιλέξτε ένα endpoint από τη λίστα για να φτιάξετε ένα αίτημα.',
        'apiconsole.send': 'Αποστολή', 'apiconsole.query_params': 'Query parameters', 'apiconsole.add_param': 'Προσθήκη παραμέτρου',
        'apiconsole.body_json': 'Σώμα αιτήματος (JSON)', 'apiconsole.response': 'Απάντηση',
        'apiconsole.path_params': 'Παράμετροι διαδρομής',
        'apiconsole.fill_path_params': 'Συμπληρώστε κάθε παράμετρο διαδρομής πριν την αποστολή.',
        'apiconsole.invalid_json': 'Το σώμα δεν είναι έγκυρο JSON: {msg}',
        'apiconsole.confirm_delete': 'Αποστολή {method} {url}; Αυτό μπορεί να διαγράψει οριστικά δεδομένα.',
        'apiconsole.warn_stream': 'Αυτό είναι ένα Server-Sent Events endpoint — η αποστολή κανονικού αιτήματος εδώ θα κρεμάσει έως τη λήξη χρόνου (~55s) αντί να απαντήσει αμέσως.',
        'apiconsole.warn_upload': 'Αυτό το endpoint περιμένει μεταφόρτωση αρχείου (multipart), που δεν υποστηρίζεται από τον επεξεργαστή JSON. Χρησιμοποιήστε την πραγματική σελίδα του dashboard γι\' αυτό.',
        'apiconsole.network_error': 'Σφάλμα δικτύου: {msg}',
        'apiconsole.load_error': 'Αποτυχία φόρτωσης της λίστας: {msg}',
      },
    };
    let _lang = localStorage.getItem('lang') || 'el';
    function t(key) {
      return (TRANSLATIONS[_lang] && TRANSLATIONS[_lang][key]) || TRANSLATIONS.en[key]
        || (I18N_SHARED[_lang] && I18N_SHARED[_lang][key]) || I18N_SHARED.en[key] || key;
    }
    function applyI18n() {
      document.getElementById('langEl').classList.toggle('active', _lang === 'el');
      document.getElementById('langEn').classList.toggle('active', _lang === 'en');
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
      document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.getAttribute('data-i18n-ph')); });
      document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.getAttribute('data-i18n-title')); });
    }
    function setLang(lang) { _lang = lang; localStorage.setItem('lang', lang); applyI18n(); }

    function _isDarkTheme() { return document.documentElement.getAttribute('data-bs-theme') === 'dark'; }
    function applyThemeIcon() {
      const icon = document.getElementById('themeToggleIcon');
      if (icon) icon.className = 'bi ' + (_isDarkTheme() ? 'bi-sun' : 'bi-moon-stars');
    }
    function setTheme(theme) { document.documentElement.setAttribute('data-bs-theme', theme); localStorage.setItem('theme', theme); applyThemeIcon(); }
    function toggleTheme() { setTheme(_isDarkTheme() ? 'light' : 'dark'); }

    applyI18n();
    applyThemeIcon();
  </script>
  <script src="{{ url_for('static', filename='api_console.js') }}"></script>
</body>
</html>
