<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set password — data.gov.gr Monitor</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗄️</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background: #f0f2f5; }
    .login-card {
      max-width: 380px;
      margin: 10vh auto 0;
      border: none;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,.10);
    }
    .login-header {
      background: linear-gradient(135deg, #003366 0%, #0057b8 100%);
      border-radius: 16px 16px 0 0;
      padding: 2rem;
      text-align: center;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="login-card card">
    <div class="login-header">
      <i class="bi bi-shield-lock fs-1 d-block mb-2"></i>
      <div class="fw-bold fs-5">data.gov.gr Monitor</div>
      <div class="text-white-50 small mt-1">Set your password</div>
    </div>
    <div class="card-body p-4">
      {% if not valid %}
      <div class="alert alert-danger small mb-3">This link is invalid or has expired.</div>
      <a href="{{ url_for('forgot_password') }}" class="btn btn-outline-secondary w-100">Request a new link</a>
      {% else %}
      <form method="post" action="{{ url_for('set_password') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="token" value="{{ token }}">
        <div class="mb-3">
          <label class="form-label fw-semibold small">New password</label>
          <input type="password" name="password" class="form-control {% if error %}is-invalid{% endif %}"
                 autofocus autocomplete="new-password" minlength="8" required>
          <div class="form-text small">At least 8 characters.</div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold small">Confirm password</label>
          <input type="password" name="password2" class="form-control {% if error %}is-invalid{% endif %}"
                 autocomplete="new-password" minlength="8" required>
          {% if error %}
          <div class="invalid-feedback">{{ error }}</div>
          {% endif %}
        </div>
        <button type="submit" class="btn btn-primary w-100">
          <i class="bi bi-check-lg me-1"></i>Set password and sign in
        </button>
      </form>
      {% endif %}
    </div>
  </div>
</body>
</html>
