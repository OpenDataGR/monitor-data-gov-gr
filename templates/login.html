<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>Sign in — data.gov.gr Monitor</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗄️</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background: #f0f2f5; }
    .login-card {
      max-width: 380px;
      margin: 10vh auto 0;
      border: none;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,.10);
    }
    .login-header {
      background: linear-gradient(135deg, #003366 0%, #0057b8 100%);
      border-radius: 16px 16px 0 0;
      padding: 2rem;
      text-align: center;
      color: #fff;
    }
    /* Honeypot: invisible to humans, but present in the DOM/tab order removed —
       bots that auto-fill every input on the page will populate it. */
    .hp-field {
      position: absolute;
      left: -9999px;
      top: -9999px;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div class="login-card card">
    <div class="login-header">
      <i class="bi bi-database-check fs-1 d-block mb-2"></i>
      <div class="fw-bold fs-5">data.gov.gr Monitor</div>
      <div class="text-white-50 small mt-1">Sign in to continue</div>
    </div>
    <div class="card-body p-4">
      <form method="post" action="{{ url_for('login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="next" value="{{ next }}">
        <div class="hp-field" aria-hidden="true">
          <label for="hp_check">Leave this field blank</label>
          <input type="text" id="hp_check" name="hp_check" tabindex="-1" autocomplete="off"
                 data-bwignore="true" data-lpignore="true" data-1p-ignore="true" data-form-type="other">
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold small">Email</label>
          <input type="email" name="email" class="form-control {% if error %}is-invalid{% endif %}"
                 autofocus autocomplete="username">
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold small">Password</label>
          <input type="password" name="password" class="form-control {% if error %}is-invalid{% endif %}"
                 autocomplete="current-password">
          {% if error %}
          <div class="invalid-feedback">{{ error }}</div>
          {% endif %}
        </div>
        <button type="submit" class="btn btn-primary w-100">
          <i class="bi bi-box-arrow-in-right me-1"></i>Sign in
        </button>
      </form>
      <button type="button" id="passkeyLoginBtn" class="btn btn-outline-secondary w-100 mt-2" style="display:none" onclick="_submitPasskeyLogin()">
        <i class="bi bi-fingerprint me-1"></i>Sign in with a passkey
      </button>
      <div id="passkeyLoginError" class="text-danger small mt-2 text-center d-none"></div>
      <div class="text-center mt-3">
        <a href="{{ url_for('forgot_password') }}" class="small text-decoration-none">Forgot your password?</a>
      </div>
    </div>
  </div>
  <footer class="text-center text-muted py-3 mt-3" style="font-size:.75rem;">
    &copy; {{ current_year }} Τμήμα Προτύπων και Τεχνολογικών Εφαρμογών Δεδομένων, Ειδική Γραμματεία Τεχνητής Νοημοσύνης και Διακυβέρνησης Δεδομένων
  </footer>
  <script src="{{ url_for('static', filename='webauthn.js') }}" defer></script>
  <script defer>
    window.__WEBAUTHN_URLS__ = {
      begin: {{ url_for('webauthn_login_begin')|tojson }},
      complete: {{ url_for('webauthn_login_complete')|tojson }},
    };
    document.addEventListener('DOMContentLoaded', () => {
      if (webauthnSupported()) document.getElementById('passkeyLoginBtn').style.display = '';
    });
    async function _submitPasskeyLogin() {
      const btn = document.getElementById('passkeyLoginBtn');
      const errEl = document.getElementById('passkeyLoginError');
      errEl.classList.add('d-none');
      btn.disabled = true;
      const originalHtml = btn.innerHTML;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Waiting for passkey…';
      try {
        const data = await loginWithPasskey(window.__WEBAUTHN_URLS__);
        window.location.href = data.redirect;
      } catch (e) {
        errEl.textContent = e.message || 'Passkey sign-in failed';
        errEl.classList.remove('d-none');
        btn.disabled = false;
        btn.innerHTML = originalHtml;
      }
    }
  </script>
</body>
</html>
