<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot password — data.gov.gr Monitor</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗄️</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background: #f0f2f5; }
    .login-card {
      max-width: 380px;
      margin: 10vh auto 0;
      border: none;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,.10);
    }
    .login-header {
      background: linear-gradient(135deg, #003366 0%, #0057b8 100%);
      border-radius: 16px 16px 0 0;
      padding: 2rem;
      text-align: center;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="login-card card">
    <div class="login-header">
      <i class="bi bi-key fs-1 d-block mb-2"></i>
      <div class="fw-bold fs-5">data.gov.gr Monitor</div>
      <div class="text-white-50 small mt-1">Reset your password</div>
    </div>
    <div class="card-body p-4">
      {% if sent %}
      <div class="alert alert-success small mb-3">
        If that email address has an account, a reset link has been sent to it. Check your inbox.
      </div>
      <a href="{{ url_for('login') }}" class="btn btn-outline-secondary w-100">
        <i class="bi bi-arrow-left me-1"></i>Back to sign in
      </a>
      {% else %}
      <p class="small text-muted">Enter your email and we'll send you a link to set a new password.</p>
      <form method="post" action="{{ url_for('forgot_password') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label fw-semibold small">Email</label>
          <input type="email" name="email" class="form-control" autofocus autocomplete="username" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">
          <i class="bi bi-send me-1"></i>Send reset link
        </button>
      </form>
      <div class="text-center mt-3">
        <a href="{{ url_for('login') }}" class="small text-decoration-none">Back to sign in</a>
      </div>
      {% endif %}
    </div>
  </div>
</body>
</html>
