name: Deploy to Azure VM

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Pull latest code
        run: |
          cd /home/localadmin/monitor-data-gov-gr
          git pull
          date -u '+%Y-%m-%d %H:%M UTC' > build_date.txt

      - name: Install dependencies
        run: |
          cd /home/localadmin/monitor-data-gov-gr
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Reload service
        run: |
          pkill -TERM -u localadmin -f "gunicorn.*app:app" || true
          sleep 15
          systemctl is-active --quiet monitor-data-gov-gr && echo "Service restarted OK" || (journalctl -u monitor-data-gov-gr -n 30 --no-pager; exit 1)
