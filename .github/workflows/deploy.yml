name: Deploy to Azure VM

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Pull latest code
        run: |
          cd /home/localadmin/monitor-data-gov-gr
          git pull

      - name: Install dependencies
        run: |
          cd /home/localadmin/monitor-data-gov-gr
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd /home/localadmin/monitor-data-gov-gr
          source venv/bin/activate
          python -m pytest tests/ -v

  deploy:
    needs: test
    runs-on: self-hosted

    steps:
      - name: Pull latest code
        run: |
          cd /home/localadmin/monitor-data-gov-gr
          git pull
          date -u '+%Y-%m-%d %H:%M UTC' > build_date.txt

      - name: Install dependencies
        run: |
          cd /home/localadmin/monitor-data-gov-gr
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Reload service
        run: |
          # Clears any rate-limit lockout (systemd's StartLimitBurst/
          # StartLimitIntervalSec) from a PRIOR failed deploy before this
          # one's own restart attempt -- without this, a service that once
          # crash-looped past the burst limit stays permanently refusing to
          # even try starting again, silently, since nothing new gets
          # logged until someone notices and runs this by hand. Every
          # subsequent deploy's is-active check then keeps failing on that
          # same stale state regardless of whether the actual code that
          # caused the original crash was ever fixed (see 2026-07-28
          # incident in deploy/README.md).
          sudo systemctl reset-failed monitor-data-gov-gr monitor-data-gov-gr-worker || true
          pkill -TERM -u localadmin -f "gunicorn.*app:app" || true
          pkill -TERM -u localadmin -f "python.*background_worker.py" || true
          sleep 15
          systemctl is-active --quiet monitor-data-gov-gr && echo "Web service restarted OK" || (journalctl -u monitor-data-gov-gr -n 30 --no-pager; exit 1)
          systemctl is-active --quiet monitor-data-gov-gr-worker && echo "Worker service restarted OK" || (journalctl -u monitor-data-gov-gr-worker -n 30 --no-pager; exit 1)
