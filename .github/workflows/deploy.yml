name: Deploy to Azure VM

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Pull latest code
        run: |
          cd /home/localadmin/communcation_dashboard
          git pull
          date -u '+%Y-%m-%d %H:%M UTC' > build_date.txt

      - name: Install dependencies
        run: |
          cd /home/localadmin/communcation_dashboard
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Reload service
        run: |
          # reset-failed clears systemd restart-limit; requires sudoers entry:
          # localadmin ALL=(ALL) NOPASSWD: /bin/systemctl restart communcation_dashboard, /bin/systemctl reset-failed communcation_dashboard
          sudo systemctl reset-failed communcation_dashboard || true
          sudo systemctl restart communcation_dashboard
          sleep 3
          systemctl is-active --quiet communcation_dashboard && echo "Service restarted OK" || (journalctl -u communcation_dashboard -n 30 --no-pager; exit 1)
