name: Deploy to Azure VM

# The GitHub repo is now OpenDataGR/monitor-data-gov-gr, but the VM directory
# and systemd service below are still named crm-data-gov-gr -- that rename
# happens separately, on the VM itself.

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Pull latest code
        run: |
          cd /home/localadmin/crm-data-gov-gr
          git pull
          date -u '+%Y-%m-%d %H:%M UTC' > build_date.txt

      - name: Install dependencies
        run: |
          cd /home/localadmin/crm-data-gov-gr
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Reload service
        run: |
          pkill -TERM -u localadmin -f "gunicorn.*app:app" || true
          sleep 5
          systemctl is-active --quiet crm-data-gov-gr && echo "Service restarted OK" || (journalctl -u crm-data-gov-gr -n 30 --no-pager; exit 1)
