name: Deploy to Azure VM

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Pull latest code
        run: |
          cd /home/localadmin/communcation_dashboard
          git pull
          date -u '+%Y-%m-%d %H:%M UTC' > build_date.txt

      - name: Install dependencies
        run: |
          cd /home/localadmin/communcation_dashboard
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Reload service
        run: |
          MAIN_PID=$(systemctl show communcation_dashboard --property=MainPID --value 2>/dev/null || echo "")
          if [ -n "$MAIN_PID" ] && [ "$MAIN_PID" -gt 0 ]; then
            kill -HUP "$MAIN_PID"
            echo "Sent SIGHUP to gunicorn master PID $MAIN_PID — workers reloading"
          else
            echo "ERROR: could not find service PID" && exit 1
          fi
