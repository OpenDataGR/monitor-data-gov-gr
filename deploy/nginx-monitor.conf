# Installed on the production VM at /etc/nginx/sites-enabled/monitor
# After copying changes here to the VM: sudo nginx -t && sudo systemctl reload nginx
#
# No proxy_read_timeout override here, so it's on nginx's 60s default -- that
# happens to be comfortably above the 55s bound on /api/communications/stream
# SSE connections (app.py), but it's an implicit dependency: if that bound is
# ever raised past 60s without also raising proxy_read_timeout here, streams
# would start getting cut mid-connection by the proxy instead of the app.
#
# No proxy_buffering off needed either -- the SSE route already sends
# X-Accel-Buffering: no per-response, which nginx honors without a
# config-level override.
server {
    listen 80 default_server;
    server_name monitor.data.gov.gr;

    # nginx's compile-time default (1m) was silently rejecting SendGrid's
    # Inbound Parse POSTs to /api/email-sync/inbound-webhook/<secret> with a
    # bare 413 before they ever reached the app -- a raw forwarded-email MIME
    # payload (full headers, HTML+plain multipart, an embedded signature
    # image) crosses 1MB easily once a thread's been re-forwarded a few
    # times. 25m leaves headroom under SendGrid's own ~30MB Inbound Parse
    # limit without raising it so high it stops being a meaningful bound.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
